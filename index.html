
<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quiz de Inglés</title>
<style>
*{box-sizing:border-box}
body{
 font-family:Arial,sans-serif;
 background:#edf1ff;
 margin:0;padding:20px;
 display:flex;justify-content:center;
 color:#202945
}
main{
 background:white;width:100%;max-width:720px;
 padding:25px;border-radius:20px;
 box-shadow:0 8px 25px #0002
}
h1{color:#4559bd}
.sub{color:#68738a}
.top{display:flex;justify-content:space-between;gap:10px}
.track{height:10px;background:#e4e8f5;border-radius:20px;margin:15px 0 25px}
.bar{height:100%;background:#6378e5;width:0%;border-radius:20px}
.question{font-size:21px;margin:20px 0}
.option{
 display:block;width:100%;padding:15px;margin:10px 0;
 border:2px solid #e1e5f0;border-radius:12px;
 background:white;text-align:left;font-size:16px;cursor:pointer
}
.option:hover{background:#f2f4ff;border-color:#687ce5}
.option:disabled{cursor:default}
.correct{background:#d9fbe8!important;border-color:#20a36b!important}
.wrong{background:#ffe1e4!important;border-color:#d84b60!important}
.feedback{display:none;padding:15px;border-radius:12px;margin-top:15px;line-height:1.5}
.show{display:block}
.good{background:#e0faed;color:#126b43}
.bad{background:#ffe8ea;color:#9e263b}
button.next{
 background:#4c60ce;color:white;border:0;border-radius:12px;
 padding:14px 20px;font-size:16px;cursor:pointer;margin-top:18px
}
button:disabled{opacity:.4;cursor:default}
.hidden{display:none}
.score{font-size:45px;color:#4559bd;font-weight:bold}
.review{text-align:left;line-height:1.5}
</style>
</head>
<body>
<main>
<h1>🎯 English Challenge 2</h1>
<p class="sub">¡Demuestra cuánto sabes del presente simple!</p>

<div id="quiz">
 <div class="top">
  <b id="counter">Pregunta 1 de 20</b>
  <b id="points">Puntos: 0</b>
 </div>
 <div class="track"><div class="bar" id="bar"></div></div>
 <div class="question" id="question"></div>
 <div id="options"></div>
 <div id="feedback" class="feedback"></div>
 <button class="next" id="next" disabled>Siguiente →</button>
</div>

<div id="result" class="hidden"></div>
</main>

<script>
const questions = [
{
 q:"My grandmother ___ delicious cakes.",
 o:["make","makes","making"],
 a:1,
 e:"My grandmother = she. En afirmativa agregamos -s: makes."
},
{
 q:"___ your brother study English?",
 o:["Do","Does","Is"],
 a:1,
 e:"Your brother = he. Para preguntar usamos DOES."
},
{
 q:"They ___ go to school on Saturdays.",
 o:["doesn't","don't","isn't"],
 a:1,
 e:"They usa DON'T para formar oraciones negativas."
},
{
 q:"The cat ___ milk every morning.",
 o:["drink","drinks","drinking"],
 a:1,
 e:"The cat = it. En afirmativa agregamos -s: drinks."
},
{
 q:"___ you like chocolate?",
 o:["Does","Do","Are"],
 a:1,
 e:"You utiliza DO para hacer preguntas."
},
{
 q:"He doesn't ___ soccer.",
 o:["plays","play","playing"],
 a:1,
 e:"Después de DOESN'T, el verbo queda normal: play."
},
{
 q:"My friends ___ video games.",
 o:["plays","play","playing"],
 a:1,
 e:"My friends = they. En afirmativa usamos play sin -s."
},
{
 q:"She ___ eat fish.",
 o:["don't","doesn't","isn't"],
 a:1,
 e:"She utiliza DOESN'T para negar."
},
{
 q:"___ your father drive a car?",
 o:["Do","Does","Don't"],
 a:1,
 e:"Your father = he. Por eso usamos DOES."
},
{
 q:"I ___ my homework every afternoon.",
 o:["does","do","doesn't"],
 a:1,
 e:"I do my homework. Es una oración afirmativa."
},
{
 q:"Choose the correct sentence.",
 o:["She go to school.","She goes to school.","She going to school."],
 a:1,
 e:"Con she, go cambia a goes en afirmativa."
},
{
 q:"___ they live in Colombia?",
 o:["Does","Do","Is"],
 a:1,
 e:"They utiliza DO para preguntar."
},
{
 q:"My dog ___ sleep on the sofa.",
 o:["don't","doesn't","isn't"],
 a:1,
 e:"My dog = it. Para negar usamos DOESN'T."
},
{
 q:"We ___ pizza every Friday.",
 o:["eats","eat","eating"],
 a:1,
 e:"We utiliza el verbo base: eat."
},
{
 q:"Choose the correct negative sentence.",
 o:[
  "I doesn't like tea.",
  "I don't like tea.",
  "I not like tea."
 ],
 a:1,
 e:"Con I utilizamos DON'T."
},
{
 q:"___ she play the piano?",
 o:["Do","Does","Are"],
 a:1,
 e:"She utiliza DOES para preguntar."
},
{
 q:"Peter doesn't ___ television at night.",
 o:["watches","watch","watching"],
 a:1,
 e:"Después de DOESN'T usamos el verbo sin -s: watch."
},
{
 q:"The children ___ in the park.",
 o:["plays","play","doesn't play"],
 a:1,
 e:"The children = they. La forma afirmativa es play."
},
{
 q:"___ your mother cook every day?",
 o:["Do","Does","Is"],
 a:1,
 e:"Your mother = she. Utilizamos DOES."
},
{
 q:"He ___ his teeth every morning.",
 o:["brush","brushes","brushing"],
 a:1,
 e:"Con he, brush cambia a brushes."
}
];

let index=0;
let score=0;
let mistakes=[];
let answered=false;

const $=id=>document.getElementById(id);

function showQuestion(){
 answered=false;
 const q=questions[index];

 $("counter").textContent=`Pregunta ${index+1} de 20`;
 $("points").textContent=`Puntos: ${score}`;
 $("bar").style.width=(index/20*100)+"%";
 $("question").textContent=q.q;
 $("feedback").className="feedback";
 $("feedback").textContent="";
 $("next").disabled=true;
 $("next").textContent=index===19?"Ver resultado":"Siguiente →";
 $("options").innerHTML="";

 q.o.forEach((option,i)=>{
  const btn=document.createElement("button");
  btn.className="option";
  btn.textContent=String.fromCharCode(65+i)+") "+option;
  btn.onclick=()=>answer(i,btn);
  $("options").appendChild(btn);
 });
}

function answer(choice,button){
 if(answered)return;
 answered=true;

 const q=questions[index];
 const buttons=[...$("options").children];
 const correct=choice===q.a;

 buttons.forEach((b,i)=>{
  b.disabled=true;
  if(i===q.a)b.classList.add("correct");
 });

 if(correct){
  score++;
 }else{
  button.classList.add("wrong");
  mistakes.push({
   question:index+1,
   text:q.q,
   chosen:q.o[choice],
   correct:q.o[q.a],
   explanation:q.e
  });
 }

 $("points").textContent=`Puntos: ${score}`;
 $("feedback").className="feedback show "+(correct?"good":"bad");
 $("feedback").innerHTML=
  (correct?"<b>¡Excelente! ✓</b> ":"<b>¡Casi! La correcta está marcada.</b> ")
  +q.e;

 $("next").disabled=false;
}

$("next").onclick=()=>{
 if(index<19){
  index++;
  showQuestion();
 }else{
  showResult();
 }
};

function showResult(){
 $("quiz").classList.add("hidden");
 $("result").classList.remove("hidden");

 const grade=(score/20*5).toFixed(1);

 let review="";

 if(mistakes.length===0){
  review="<p>¡No cometiste ningún error! 🏆</p>";
 }else{
  review="<h3>📚 Repasa tus errores:</h3><ol class='review'>";

  mistakes.forEach(m=>{
   review+=`
   <li>
    <b>${m.text}</b><br>
    Tu respuesta: ${m.chosen}<br>
    Respuesta correcta: <b>${m.correct}</b><br>
    <small>${m.explanation}</small>
   </li><br>`;
  });

  review+="</ol>";
 }

 $("result").innerHTML=`
  <h2>¡Terminaste el examen! 🎉</h2>
  <div class="score">${score}/20</div>
  <h3>Tu nota: ${grade} / 5.0</h3>
  <p>${score>=18?"¡Excelente! Dominas muy bien el tema.":
       score>=14?"¡Muy bien! Sigue practicando.":
       "¡No te rindas! Repasa los errores y vuelve a intentarlo."}</p>
  ${review}
  <button class="next" onclick="location.reload()">Volver a jugar ↻</button>
`;
}

showQuestion();
</script>
</body>
</html>
